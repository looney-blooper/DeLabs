name: DeLabs CI Pipeline

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------
  # BACKEND CI: FastAPI & LangGraph (Python)
  # -------------------------------------------
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: . 
        
    # --- NEW: Inject your secrets as Environment Variables ---
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Add any others your swarm needs to boot up:
      # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    # ---------------------------------------------------------

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Check syntax and formatting
        run: |
          pip install flake8
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      # --- NEW: A sanity check to ensure the Swarm actually compiles ---
      - name: Test Swarm Compilation
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          RABBITMQ_URL: "amqp://guest:guest@localhost:5672/"
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "from src.orchestrator.builder import delabs_swarm; print(' Swarm compiled successfully!')"
